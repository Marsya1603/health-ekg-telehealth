; HealthEKG Worker — contoh konfigurasi
; Salin menjadi config.ini lalu isi nilai nyata.
;   cp config.example.ini config.ini
; Batasi izin baca: chmod 600 config.ini
; Environment variable dapat menimpa nilai di sini:
;   MQTT_USERNAME, MQTT_PASSWORD, ASCON_KEY_HEX

[mqtt]
host = 127.0.0.1
port = 1883
; Kredensial khusus worker (hanya izin subscribe topic telemetry)
username =
password =
topic_prefix = healthekg
qos = 1

[database]
host = 127.0.0.1
port = 3306
database = healthekg
username = healthekg
password =

[security]
; Kunci ASCON-128: 32 karakter hex (16 byte).
; Generate: openssl rand -hex 16
; Kunci yang sama harus dipakai perangkat ESP32. JANGAN disimpan di source code.
ascon_key_hex =

[app]
worker_timeout = 120
